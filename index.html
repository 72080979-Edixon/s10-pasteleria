<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastelería "Dulce Sabor"</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">

            <a class="navbar-brand fw-bold" href="#">
                Pastelería "Dulce Sabor"
            </a>

            <button
                class="btn btn-light position-relative"
                data-bs-toggle="offcanvas"
                data-bs-target="#carritoCanvas">

                Carrito

                <span
                    id="contador"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    0
                </span>

            </button>

        </div>
    </nav>

    <!-- Hero -->
    <section class="hero text-center">
        <div class="container py-5">

            <h1 class="display-4 fw-bold">
                Molmentos dulces e inovidables para compartir
            </h1>

            <p class="lead">
                Encuentra las mejores tortas, cupcakes y postres artesanales a dispocisión.
            </p>

        </div>
    </section>

    <!-- Buscador -->
    <div class="container mt-4">
        <input
            type="text"
            id="buscar"
            class="form-control form-control-lg"
            placeholder="Buscar producto...">
    </div>

    <!-- Filtros -->
    <div class="container mt-3">

        <ul class="nav nav-pills justify-content-center gap-2">

            <li class="nav-item">
                <button class="btn btn-outline-primary filtro" data-categoria="Todos">
                    Todos
                </button>
            </li>

            <li class="nav-item">
                <button class="btn btn-outline-primary filtro" data-categoria="Tortas">
                    Tortas
                </button>
            </li>

            <li class="nav-item">
                <button class="btn btn-outline-primary filtro" data-categoria="Cupcakes">
                    Cupcakes
                </button>
            </li>

            <li class="nav-item">
                <button class="btn btn-outline-primary filtro" data-categoria="Postres">
                    Postres
                </button>
            </li>

        </ul>

    </div>

    <!-- Productos -->
    <div class="container py-5">
        <div id="productos" class="row g-4"></div>
    </div>

    <!-- Formulario -->
    <div class="container mb-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                Pedido Especial
            </div>

            <div class="card-body">

                <form id="formPedido">

                    <input
                        type="text"
                        class="form-control mb-3"
                        placeholder="Nombre completo"
                        required>

                    <textarea
                        class="form-control mb-3"
                        rows="4"
                        placeholder="Describe tu pedido personalizado"
                        required></textarea>

                    <button type="submit" class="btn btn-primary">
                        Enviar Pedido
                    </button>

                </form>

                <div
                    id="mensaje"
                    class="alert alert-success mt-3 d-none">
                    Pedido enviado correctamente.
                </div>

            </div>

        </div>

    </div>

    <!-- Carrito -->
    <div
        class="offcanvas offcanvas-end"
        tabindex="-1"
        id="carritoCanvas">

        <div class="offcanvas-header">

            <h5>Carrito de Compras</h5>

            <button
                type="button"
                   data-bs-dismiss="offcanvas"
                aria-label="Cerrar">
            </button>

        </div>

        <div class="offcanvas-body">

            <ul
                id="listaCarrito"
                class="list-group mb-3">
            </ul>

            <h4>
                Total: S/
                <span id="total">0</span>
            </h4>

            <button
                id="vaciar"
                class="btn btn-danger w-100">
                Vaciar Carrito
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tienda.js"></script>

</body>

</html>
